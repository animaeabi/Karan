  app.innerHTML=topbar('leavePlayer()')+`<div class="waitcard"><div class="spinner"></div><div class="rank" style="font-size:22px">${reconnect?'Reconnecting':'Connecting'} to ${esc(code)}…</div></div>`;
  let s; try{ s=await getSB(); }catch(e){ return liveError(); }
  const gid=clientId();
  L={role:'player',net:'p2p',mode:'quiz',code,gid,pc:null,dc:null,pending:[],ready:false,name:(saved?saved.name:null),picks:[],room:null,rroom:null,subs:{},voted:{},bye:false,display:'cast',photos:{},_pbuf:{}};
  history.replaceState(null,'','#pg='+code);
  L.sig=s.channel('rtc-'+code,{config:{broadcast:{self:false}}});
  L.sig.on('broadcast',{event:'sig'},({payload})=>{ if(payload&&payload.to===gid) pgGuestSignal(payload); });
  L.sig.subscribe(st=>{ if(st==='SUBSCRIBED'){ pgSigSend({to:'host',from:gid,type:'hello'});
    L.helloTimer=setInterval(()=>{ if(L&&L.net==='p2p'&&L.role==='player'&&!(L.dc&&L.dc.readyState==='open')) pgSigSend({to:'host',from:L.gid,type:'hello'}); else if(L&&L.helloTimer){clearInterval(L.helloTimer);L.helloTimer=null;} },1800); } });
}
async function pgGuestSignal(m){
  if(m.type==='offer'){
    if(L.pc)return;
    const pc=new RTCPeerConnection(ICE_CONF); L.pc=pc;
    pc.onicecandidate=e=>{ if(e.candidate) pgSigSend({to:'host',from:L.gid,type:'ice',candidate:e.candidate}); };
    pc.onconnectionstatechange=()=>{ if(pc.connectionState==='failed') pgGuestLost(); };
    pc.ondatachannel=e=>{ L.dc=e.channel; L.dc.onopen=()=>pgGuestReady(); L.dc.onmessage=ev=>{ let o;try{o=JSON.parse(ev.data);}catch(e){return;} pgGuestMsg(o); }; L.dc.onclose=()=>pgGuestLost(); };
    try{await pc.setRemoteDescription(m.sdp);}catch(e){return;} L.ready=true;
    for(const c of L.pending){ try{await pc.addIceCandidate(c);}catch(e){} } L.pending=[];
    const ans=await pc.createAnswer(); await pc.setLocalDescription(ans);
    pgSigSend({to:'host',from:L.gid,type:'answer',sdp:pc.localDescription});
  } else if(m.type==='ice'){
    if(L.pc&&L.ready){ try{await L.pc.addIceCandidate(m.candidate);}catch(e){} } else L.pending.push(m.candidate);
  }
}
function pgSend(o){ if(L&&L.dc&&L.dc.readyState==='open'){ try{L.dc.send(JSON.stringify(o));}catch(e){} } }
function pgGuestReady(){ if(L&&L.helloTimer){clearInterval(L.helloTimer);L.helloTimer=null;}
  if(!L.name){ renderNameEntry(); return; }
  saveP2PGuest(); pgSend({t:'join',name:L.name}); renderPlayerWait(); }
function pgGuestMsg(o){
  if(!L||L.role!=='player')return;
  if(o.t==='joined'){ L.pid=o.pid; L.name=o.name; if(Array.isArray(o.picks))L.picks=o.picks; if(o.subs)L.subs=o.subs; if(o.voted)L.voted=o.voted; saveP2PGuest(); }
  else if(o.t==='room'){ L.mode='quiz'; L.display=o.display||'cast'; L.room={status:o.status,current_q:o.current_q,total:o.total}; L.q=o.q; pgGuestRender(); }
  else if(o.t==='rroom'){ L.mode='roast'; L.display=o.display||'cast'; if(o.phase==='writing') L.guestEndsAt=Date.now()+(o.endsIn||0); L.rroom={phase:o.phase,cur:o.cur,total:o.total,roasts:o.roasts}; pgRoastGuestRender(); }
  else if(o.t==='pchunk'){ if(!L._pbuf)L._pbuf={}; const b=L._pbuf[o.i]||(L._pbuf[o.i]={n:o.n,parts:[]}); b.parts[o.k]=o.d;
    if(b.parts.filter(x=>x!=null).length===o.n){ if(!L.photos)L.photos={}; L.photos[o.i]=b.parts.join(''); delete L._pbuf[o.i]; pgMaybeRefreshPhoto(o.i); } }
  else if(o.t==='bye'){ L.bye=true; clearP2PGuest(); pgByeScreen(); }
}
function submitNameP2P(){ const el=document.getElementById('myname'); const name=(el.value||'').trim().slice(0,16); if(!name){ flash("Add a name first",true); return; } L.name=name; saveP2PGuest(); pgSend({t:'join',name}); renderPlayerWait(); }
function pgGuestRender(){
  if(!L||!L.room){ renderPlayerWait(); return; }
  const st=L.room.status;
  if(st==='lobby'||st==='ready'){ renderPlayerWait(); return; }
  if(st==='ended'){ pgPlayerFinal(); return; }
  const cq=L.room.current_q|0;
  if(L.picks[cq]!=null){ pgRenderLocked(cq); return; }
  pgRenderOptions(cq);
}
function pgRenderOptions(q){
  const Q=L.q; if(!Q){ renderPlayerWait(); return; }
  const opts=Q.opts||[], dev=L.display==='device';
  app.innerHTML=`
    <div class="turnbanner">${dev?'📱':'📺'} <b>${esc(L.name)}</b><span class="pill">${esc(L.code)} · Q ${q+1}/${L.room.total}</span></div>
    <div class="qcard"><div class="qbody" style="padding-top:20px">
      ${dev?pgPhoto(q):''}
      <div class="qnum">Question ${q+1} of ${L.room.total}${dev?'':' · look at the photo on the TV 📺'}</div>
      <div class="qtext" style="font-size:19px;color:var(--ink);margin:6px 0 4px">${esc(Q.text)}</div>
      <div class="qsub" style="font-size:14px;color:var(--muted);margin:0 0 14px">Pick your answer 👇</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" onclick="pgPick(${q},${i})"><span class="lab">${letters[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    </div></div>
    <footer class="credit">Your pick is hidden until the ${dev?'reveal':'big reveal on the TV'}.</footer>`;
  window.scrollTo({top:0});
}
function pgPick(q,i){ if(!L||L.picks[q]!=null)return; L.picks[q]=i; pgSend({t:'answer',qi:q,opt:i}); pgRenderLocked(q); }
function pgRenderLocked(q){
  app.innerHTML=topbar('leavePlayer()')+`
    <div class="lockcard"><div class="big">✅</div>
      <div class="rank">Locked in!</div>
      <div class="sub">Answer ${letters[L.picks[q]]} sent. Eyes on the TV — next question is coming.</div>
      <div class="conn" style="margin-top:14px">Q ${q+1} of ${L.room.total} · room ${esc(L.code)}</div></div>`;
}
function pgPlayerFinal(){
  let voted=0, tot=L.room.total||0; for(let i=0;i<tot;i++) if(typeof L.picks[i]==='number')voted++;
  burst(true);
  app.innerHTML=topbar('leavePlayer()')+`
    <div class="lockcard"><div class="big">🗳️</div>
      <div class="rank">Votes in!</div>
      <div class="sub">Thanks, ${esc(L.name)} — you voted on ${voted} of ${tot}. The room's verdict is rolling out on the TV. 📺</div>
      <button class="cta alt" style="margin-top:16px" onclick="leavePlayer()">Done</button></div>`;
}
function pgRoastGuestRender(){
  if(!L||!L.rroom){ roastPlayerWait(); return; }
  const r=L.rroom, ph=r.phase, cur=r.cur|0;
  if(ph==='lobby'){ roastPlayerWait(); return; }
  if(ph==='reveal'||ph==='done'){ clearTick(); roastPlayerFinal(); return; }
  if(ph==='writing'){
    if(L.subs&&L.subs[cur]){ clearTick(); return pgRoastWaitMsg('Roast locked in 🔥','Watch the TV — next photo soon.',cur); }
    return pgRoastWrite(cur);
  }
  clearTick();
  if(L.voted&&L.voted[cur]) return pgRoastWaitMsg('Vote locked 🗳️','Watch the TV for the results.',cur);
  return pgRoastVote(cur);
}
function pgRoastWrite(cur){
  app.innerHTML=`
    <div class="turnbanner">✍️ <b>${esc(L.name)}</b><span class="pill">${esc(L.code)} · ⏱ <span id="rtimer">${fmtClock(Math.ceil(((L.guestEndsAt||0)-Date.now())/1000))}</span></span></div>
    <div class="qcard"><div class="qbody" style="padding-top:20px">
      ${L.display==='device'?pgPhoto(cur):''}
      <div class="qnum">Photo ${cur+1} of ${L.rroom.total}${L.display==='device'?'':' — look at the TV 📺'}</div>
      <div class="qtext" style="font-size:18px;margin:6px 0 10px">Roast this photo 🔥</div>
      <textarea id="rtext" maxlength="140" rows="3" placeholder="Type your funniest roast…" style="width:100%;box-sizing:border-box;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font-family:'Inter';font-size:16px;padding:12px;resize:none"></textarea>
      <button class="cta" style="margin-top:12px" onclick="pgRoastSubmit(${cur})">Send roast →</button>
      <div class="conn" style="margin-top:8px">Keep it short &amp; savage. Auto-locks when time runs out.</div>
    </div></div>`;
  startTick();
  setTimeout(()=>{const e=document.getElementById('rtext');if(e)e.focus();},50);
}
function pgRoastSubmit(cur){
  const el=document.getElementById('rtext'); const text=(el?el.value:'').trim().slice(0,140);
  if(!text){ flash("Type a roast first",true); return; }
  if(!L.subs)L.subs={}; if(L.subs[cur])return; L.subs[cur]=true;
  pgSend({t:'roast',cur,text});
  clearTick(); pgRoastWaitMsg('Roast locked in 🔥','Watch the TV — next photo soon.',cur);
}
function pgRoastVote(cur){
  let rs=((L.rroom.roasts)||[]).filter(x=>x.author!==L.pid);
  for(let i=rs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=rs[i]; rs[i]=rs[j]; rs[j]=t; }
  if(!rs.length){ return pgRoastWaitMsg('Nothing to vote here','Your roast is in. Watch the TV. 📺',cur); }
  app.innerHTML=`
    <div class="turnbanner">🗳️ <b>${esc(L.name)}</b><span class="pill">${esc(L.code)} · ${cur+1}/${L.rroom.total}</span></div>
    <div class="qcard"><div class="qbody" style="padding-top:20px">
      ${L.display==='device'?pgPhoto(cur):''}
      <div class="qnum">Photo ${cur+1} — vote the funniest 🔥</div>
      <div class="opts">${rs.map(x=>`<button class="opt" style="text-align:left" onclick="pgVote(${cur},'${x.id}')"><span>${esc(x.text)}</span></button>`).join('')}</div>
    </div></div>
    <footer class="credit">You can't vote for your own roast.</footer>`;
  window.scrollTo({top:0});
}
function pgVote(cur,roastId){
  if(!L.voted)L.voted={}; if(L.voted[cur])return; L.voted[cur]=true;
  pgSend({t:'vote',cur,roastId});
  pgRoastWaitMsg('Vote locked 🗳️','Watch the TV for the results.',cur);
}
function pgRoastWaitMsg(title,sub,cur){
  app.innerHTML=topbar('leavePlayer()')+`
    <div class="lockcard"><div class="big">✅</div>
      <div class="rank">${esc(title)}</div>
      <div class="sub">${esc(sub)}</div>
      <div class="conn" style="margin-top:14px">Photo ${(cur|0)+1} of ${L.rroom?L.rroom.total:'?'} · room ${esc(L.code)}</div></div>`;
}
function pgGuestLost(){ if(!L||L.role!=='player'||L.bye)return;
  if(L._reconnecting)return; L._reconnecting=true; const code=L.code;
  clearTick();
  app.innerHTML=topbar('leavePlayer()')+`<div class="waitcard"><div class="spinner"></div><div class="rank" style="font-size:22px">Reconnecting…</div><div class="sub" style="color:var(--muted);margin-top:8px">Hang tight — getting you back into the game.</div><div class="conn">room ${esc(code)}</div></div>`;
  setTimeout(()=>{ if(L&&L.code===code&&!L.bye&&!(L.dc&&L.dc.readyState==='open')) joinP2P(code); },1200);
}
function pgByeScreen(){ clearTick(); app.innerHTML=topbar()+`<div class="waitcard"><div class="big" style="font-size:44px">🏁</div><div class="rank" style="font-size:22px">Game over</div><div class="sub" style="color:var(--muted);margin:8px 0 18px">The host ended the game. Thanks for playing!</div><button class="cta" onclick="home()">Home</button></div>`; }
async function resumeHostP2P(code){
  const snap=loadP2PHost(code); if(!snap) return joinP2P(code);
  cleanupLive(); cleanupP2P();
  app.innerHTML=topbar('leaveHost()')+`<div class="waitcard"><div class="spinner"></div><div class="rank" style="font-size:22px">Reconnecting your room ${esc(code)}…</div></div>`;
  let s; try{ s=await getSB(); }catch(e){ return liveError(); }
  L={role:'host',net:'p2p',mode:snap.mode,code,peers:{},players:{},roasts:snap.roasts||[],votes:snap.votes||[],status:snap.status,current_q:snap.current_q,phase:snap.phase,cur:snap.cur,phaseEndsAt:snap.phaseEndsAt||0,display:snap.display||'cast'};
  (snap.players||[]).forEach(p=>{ L.players[p.id]={id:p.id,client_id:p.id,name:p.name,last_q:(p.last_q==null?-1:p.last_q),picks:p.picks||[],online:false}; });
  history.replaceState(null,'','#pg='+code);
  L.sig=s.channel('rtc-'+code,{config:{broadcast:{self:false}}});
  L.sig.on('broadcast',{event:'sig'},({payload})=>{ if(payload&&payload.to==='host') pgHostSignal(payload); });
  L.sig.subscribe();
  if(L.mode==='roast'&&L.phase==='writing'){ L.advTimer=setTimeout(()=>advanceWritingP2P(),Math.max(0,(L.phaseEndsAt||0)-Date.now())); }
  if(L.mode==='roast'){ renderRoastHost(); if(L.phase==='writing') startTick(); } else { renderHost(); }
}

/* =================== TOAST + CONFETTI =================== */
let toastT;
function flash(msg,err){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.toggle('err',!!err); t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }
const cv=document.getElementById('confetti'), ctx=cv.getContext('2d'); let parts=[],raf=null;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){ cv.width=innerWidth; cv.height=innerHeight; } size(); addEventListener('resize',size);
function burst(big){ if(reduce)return; const n=big?120:40,cols=['#FFB23E','#FF4D6D','#39D9A8','#34C6E0','#FFF6EC'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:big?innerHeight*0.35:160,vx:(Math.random()-.5)*9,vy:-Math.random()*12-4,g:.4+Math.random()*.3,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:60+Math.random()*40});
  if(!raf)loop(); }
function loop(){ ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);
  if(parts.length){raf=requestAnimationFrame(loop);}else{ctx.clearRect(0,0,cv.width,cv.height);raf=null;} }

/* =================== ROUTER =================== */
function route(){ const h=location.hash||''; let m;
  if((m=h.match(/p2p=([A-Za-z0-9]{4})/))){ p2pTestJoin(m[1]); return; }
  if((m=h.match(/pg=([A-Za-z0-9]{4})/))){ const c=m[1]; if(loadP2PHost(c)) resumeHostP2P(c); else joinP2P(c); return; }
  if((m=h.match(/join=([A-Za-z0-9]{4})/))){ joinLive(m[1]); return; }
  if((m=h.match(/host=([A-Za-z0-9]{4})/))){ resumeHost(m[1]); return; }
  const sess=loadSession();
  if(sess&&sess.code){ joinLive(sess.code); return; }
  home(); }
route();
</script>
