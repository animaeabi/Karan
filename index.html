<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Partypedia — make it about your friend</title>
<meta name="description" content="A make-your-own roast quiz & roast battle party game. Add your friend's photos, questions and roasts." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --grape:#220E36; --grape2:#2E1247; --panel:#3A1856; --panel2:#46205F;
  --mango:#FFB23E; --mango-d:#C9791A; --coral:#FF4D6D; --coral-d:#C32C49;
  --mint:#39D9A8; --mint-d:#1E9D77; --teal:#34C6E0;
  --ink:#FFF6EC; --muted:#C8A6DD; --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--grape);color:var(--ink);
  min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 40% at 12% 8%, rgba(255,178,62,.16), transparent 60%),
    radial-gradient(55% 45% at 92% 14%, rgba(255,77,109,.16), transparent 60%),
    radial-gradient(70% 50% at 50% 108%, rgba(52,198,224,.14), transparent 60%);}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 18px 44px;}
h1,h2,h3,.disp{font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:-.01em;margin:0;}
.hidden{display:none !important}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.brandmini{display:flex;align-items:center;gap:9px;font-family:'Fredoka';font-weight:700;font-size:18px;}
.dotk{width:26px;height:26px;border-radius:8px;background:var(--mango);color:var(--grape);display:grid;place-items:center;font-family:'Fredoka';font-weight:700;box-shadow:0 3px 0 var(--mango-d);}
.ghostbtn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);
  font-family:'Inter';font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;}
.ghostbtn:hover{background:rgba(255,255,255,.1)}

.hero{text-align:center;padding:18px 4px 6px;}
.kicker{display:inline-block;font-family:'Inter';font-weight:700;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--grape);background:var(--mango);padding:6px 12px;border-radius:999px;box-shadow:0 3px 0 var(--mango-d);}
.hero h1{font-size:clamp(48px,17vw,82px);line-height:.84;margin:16px 0 6px;}
.hero h1 .a{color:var(--mango)} .hero h1 .b{color:var(--coral)}
.hero p{color:var(--muted);font-size:16px;line-height:1.5;margin:8px auto 0;max-width:23em;}
.facepile{display:flex;justify-content:center;margin:20px 0 6px;min-height:62px;}
.facepile > *{width:62px;height:62px;border-radius:50%;border:3px solid var(--grape);box-shadow:0 4px 14px rgba(0,0,0,.35);margin-left:-16px;}
.facepile img{object-fit:cover;}
.facepile .ef{display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.20),rgba(255,255,255,.05));}
.facepile > :first-child{margin-left:0;transform:rotate(-6deg)}
.facepile > :nth-child(2){transform:rotate(4deg)}
.facepile > :nth-child(3){transform:rotate(-3deg);z-index:2}
.facepile > :nth-child(4){transform:rotate(5deg)}
.facepile > :nth-child(5){transform:rotate(-5deg)}

.modes{display:grid;gap:14px;margin-top:26px;}
.mode{display:flex;align-items:center;gap:16px;text-align:left;width:100%;cursor:pointer;border:none;border-radius:20px;
  padding:18px;color:var(--grape);font-family:'Inter';transition:transform .08s ease;}
.mode:active{transform:translateY(3px)}
.mode .ico{font-size:30px;width:54px;height:54px;flex:0 0 54px;border-radius:14px;display:grid;place-items:center;background:rgba(0,0,0,.14);}
.mode .mt{display:block;font-family:'Fredoka';font-weight:700;font-size:20px;line-height:1.05}
.mode .ms{display:block;font-size:13.5px;font-weight:500;opacity:.82;margin-top:3px}
.mode.m1{background:var(--mango);box-shadow:0 6px 0 var(--mango-d)}
.mode.m2{background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--coral-d)}
.mode.m2 .ms{opacity:.9}
.mode.m3{background:var(--teal);box-shadow:0 6px 0 #1f93a8}
.mode:active{box-shadow:0 2px 0 rgba(0,0,0,.3)}
.editbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;cursor:pointer;
  border:1.5px dashed rgba(255,178,62,.55);background:rgba(255,178,62,.08);color:var(--mango);
  font-family:'Fredoka';font-weight:600;font-size:16px;padding:14px;border-radius:16px}
.editbtn:active{transform:translateY(2px)}
.home-foot{text-align:center;margin-top:22px;color:var(--muted);font-size:13px;}
.demobar{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--ink);font-size:13px;text-align:center;line-height:1.5;}
.demobar .linklike{font-size:13px;}

.progress{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:2px 0 16px;}
.pd{height:7px;width:34px;border-radius:99px;background:rgba(255,255,255,.14);}
.pd.done{background:var(--mango)} .pd.cur{background:var(--coral)}

.qcard{background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);}
.qphoto{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#160922;}
.qphoto.wide{aspect-ratio:16/10}
.qbody{padding:18px 18px 20px;}
.qnum{font-family:'Inter';font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mango)}
.qtext{font-family:'Fredoka';font-weight:600;font-size:22px;line-height:1.2;margin:8px 0 16px;}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:var(--panel2);
  border:1.5px solid var(--line);color:var(--ink);font-family:'Inter';font-weight:600;font-size:15.5px;line-height:1.25;
  padding:13px 14px;border-radius:14px;transition:transform .06s, background .15s, border-color .15s;}
.opt:hover:not(:disabled){border-color:var(--mango);background:#4d2467}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .lab{flex:0 0 28px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-family:'Fredoka';font-weight:700;font-size:15px;color:var(--mango)}
.opt[disabled]{cursor:default}
.opt.correct{background:rgba(57,217,168,.16);border-color:var(--mint)}
.opt.correct .lab{background:var(--mint);color:#06301f}
.opt.wrong{background:rgba(255,77,109,.14);border-color:var(--coral)}
.opt.wrong .lab{background:var(--coral);color:#3a0010}
.opt .mark{margin-left:auto;font-weight:800;font-size:18px}

.verdict{margin-top:16px;border-radius:16px;padding:16px;background:linear-gradient(180deg,#2a1240,#341a50);border:1px dashed rgba(255,178,62,.5);position:relative;overflow:hidden}
.verdict .stamp{position:absolute;top:-6px;right:-6px;font-family:'Fredoka';font-weight:700;font-size:12px;letter-spacing:.1em;color:#fff;background:var(--coral);padding:6px 30px;transform:rotate(8deg) translateY(10px);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.verdict.ok .stamp{background:var(--mint);color:#06301f}
.verdict h4{font-family:'Inter';font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mango);margin:0 0 6px}
.verdict .ans{font-family:'Fredoka';font-weight:600;font-size:18px;line-height:1.2;margin-bottom:6px}
.verdict .roast{color:var(--muted);font-size:14.5px;line-height:1.45;font-style:italic}

.cta{appearance:none;border:none;cursor:pointer;font-family:'Fredoka';font-weight:700;font-size:18px;width:100%;padding:15px;border-radius:16px;margin-top:16px;background:var(--mango);color:var(--grape);box-shadow:0 6px 0 var(--mango-d);transition:transform .08s}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mango-d)}
.cta.alt{background:var(--panel2);color:var(--ink);box-shadow:0 6px 0 #2a1240}
.cta.alt:active{box-shadow:0 2px 0 #2a1240}
.cta:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}

.turnbanner{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.turnbanner b{font-family:'Fredoka'}
.turnbanner .pill{margin-left:auto;font-size:12px;color:var(--muted)}

.result{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px 22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.badge{width:128px;height:128px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%, var(--mango), var(--mango-d));color:var(--grape);box-shadow:0 0 0 8px rgba(255,178,62,.18), 0 14px 30px -10px rgba(0,0,0,.6);position:relative}
.badge .score{font-family:'Fredoka';font-weight:700;font-size:40px;line-height:1}
.badge .of{font-size:13px;font-weight:700;opacity:.8;margin-top:-2px}
.result .rank{font-family:'Fredoka';font-weight:700;font-size:28px;margin:4px 0 6px}
.result .sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:20px}
.btnrow{display:grid;gap:10px}

.lb{display:grid;gap:10px;margin:18px 0}
.lb .row{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600}
.lb .row.first{background:linear-gradient(90deg,rgba(255,178,62,.22),var(--panel2));border-color:var(--mango)}
.lb .rk{font-family:'Fredoka';font-weight:700;width:26px;text-align:center;color:var(--mango)}
.lb .nm{flex:1}
.lb .sc{font-family:'Fredoka';font-weight:700}

.setup h2{font-size:28px;margin-bottom:4px}
.setup p.h{color:var(--muted);margin:0 0 18px;font-size:15px}
.addrow{display:flex;gap:8px;margin-bottom:14px}
.addrow input{flex:1;background:var(--panel2);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font-family:'Inter';font-size:16px}
.addrow input:focus{outline:none;border-color:var(--mango)}
.addrow button{flex:0 0 auto;border:none;background:var(--mango);color:var(--grape);font-family:'Fredoka';font-weight:700;font-size:16px;padding:0 18px;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 var(--mango-d)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;min-height:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 14px;font-weight:600}
.chip button{border:none;background:rgba(255,255,255,.12);color:var(--ink);width:22px;height:22px;border-radius:50%;cursor:pointer;font-weight:700;line-height:1}

.cards{display:grid;gap:14px}
.flip{perspective:1000px;cursor:pointer}
.flip .inner{position:relative;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;border-radius:20px}
.flip.on .inner{transform:rotateY(180deg)}
.face{border-radius:20px;overflow:hidden;border:1px solid var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);background:var(--panel);display:flex;flex-direction:column;justify-content:center;padding:20px;text-align:center}
.face.front{position:relative}
.face.front img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/5}
.face.front .taghint{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;font-weight:700;background:linear-gradient(0deg,rgba(20,8,30,.92),transparent);font-size:14px}
.face.back h4{font-family:'Inter';font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mango);margin:0 0 8px}
.face.back .ans{font-family:'Fredoka';font-weight:600;font-size:21px;line-height:1.2;margin-bottom:10px}
.face.back .roast{color:var(--muted);font-size:14.5px;line-height:1.5;font-style:italic}

/* ---------- editor ---------- */
.ed h2{font-size:28px;margin-bottom:4px}
.ed p.h{color:var(--muted);margin:0 0 16px;font-size:14.5px;line-height:1.5}
.qlist{display:grid;gap:10px;margin-bottom:16px}
.qrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;}
.qrow .thumb{width:56px;height:56px;flex:0 0 56px;border-radius:11px;object-fit:cover;background:#160922}
.qrow .thumb.empty{display:grid;place-items:center;font-size:22px;color:var(--muted)}
.qrow .meta{flex:1;min-width:0}
.qrow .meta .n{font-size:11px;color:var(--mango);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.qrow .meta .t{font-weight:600;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .acts{display:flex;flex-direction:column;gap:5px}
.minirow{display:flex;gap:5px}
.mini{width:30px;height:30px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;cursor:pointer;font-size:14px;display:grid;place-items:center}
.mini:active{transform:scale(.94)}
.mini.del{color:var(--coral)}
.addq{width:100%;border:1.5px dashed rgba(57,217,168,.5);background:rgba(57,217,168,.08);color:var(--mint);font-family:'Fredoka';font-weight:600;font-size:16px;padding:14px;border-radius:14px;cursor:pointer;margin-bottom:18px}
.edsec{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.edsec h3{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}

/* question edit form */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mango);margin-bottom:7px}
.field input[type=text],.field textarea{width:100%;background:var(--panel2);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 13px;font-family:'Inter';font-size:15.5px}
.field textarea{resize:vertical;min-height:58px;line-height:1.35}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--mango)}
.photobox{position:relative;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);background:var(--panel2);aspect-ratio:4/3;display:grid;place-items:center}
.photobox img{width:100%;height:100%;object-fit:cover}
.photobox .ph{color:var(--muted);text-align:center;font-size:14px;padding:20px}
.photobtns{display:flex;gap:8px;margin-top:8px}
.photobtns button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:11px;font-family:'Inter';font-weight:600;font-size:14px;cursor:pointer}
.photobtns button.rm{color:var(--coral)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted);font-weight:500;margin-top:4px}
.toggle input{width:20px;height:20px;accent-color:var(--mango)}
.orow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.orow .corr{display:flex;align-items:center;gap:6px;flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:700}
.orow input[type=radio]{width:20px;height:20px;accent-color:var(--mint)}
.orow .otext{flex:1;background:var(--panel2);border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px}
.orow .otext:focus{outline:none;border-color:var(--mango)}
.orow .ormv{flex:0 0 auto;width:34px;height:38px;border:1px solid var(--line);background:transparent;color:var(--coral);border-radius:9px;cursor:pointer;font-weight:700}
.addopt{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:9px;width:100%;cursor:pointer;font-size:13.5px;font-weight:600;margin-top:2px}
.corrhint{font-size:12px;color:var(--muted);margin:-2px 0 10px}

.linkout{display:flex;gap:8px;margin-top:4px}
.linkout input{flex:1;background:var(--grape);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:11px;font-size:12.5px;font-family:ui-monospace,monospace}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--mint);color:#06301f;font-family:'Fredoka';font-weight:700;padding:12px 22px;border-radius:999px;z-index:99;opacity:0;transition:opacity .25s, transform .25s;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);pointer-events:none;max-width:90vw;text-align:center;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--coral);color:#fff}

footer.credit{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;opacity:.8}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
  .flip .inner{transition:transform .001s !important}
}
.mode.m4{background:#8E5BE8;color:#fff;box-shadow:0 6px 0 #5d33a8}
.mode.m4 .ms{opacity:.9}
.linklike{background:none;border:none;color:var(--mango);font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter';text-decoration:underline}

/* live host */
.lobby{text-align:center}
.roomcode{font-family:'Fredoka';font-weight:700;letter-spacing:.18em;font-size:clamp(44px,13vw,64px);color:var(--mango);line-height:1;margin:6px 0}
.qrbox{background:#fff;border-radius:18px;padding:14px;display:inline-block;margin:6px auto 4px;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.qrbox img,.qrbox canvas{display:block;width:200px;height:200px;border-radius:6px}
.joinurl{font-size:12.5px;color:var(--muted);word-break:break-all;margin:8px auto 0;max-width:24em;font-family:ui-monospace,monospace}
.statusline{color:var(--muted);font-size:14px;margin:14px 0 4px}
.plist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.ptag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.ptag.done{border-color:var(--mint);color:var(--mint)}
.bigboard{display:grid;gap:9px;margin:8px 0 4px}
.bigboard .row{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bigboard .row.first{background:linear-gradient(90deg,rgba(255,178,62,.22),var(--panel2));border-color:var(--mango)}
.bigboard .rk{font-family:'Fredoka';font-weight:700;width:30px;text-align:center;color:var(--mango);font-size:18px}
.bigboard .nm{flex:1;font-weight:700}
.bigboard .prog{font-size:12px;color:var(--muted);margin-left:6px}
.bigboard .sc{font-family:'Fredoka';font-weight:700;font-size:20px}
.waitcard{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px 22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--mango);margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.conn{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.conn b{color:var(--mint)}
@media (min-width:480px){ .cards{grid-template-columns:1fr 1fr} }

.tabbar{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:5px;margin-bottom:18px}
.tab{flex:1;border:none;background:transparent;color:var(--muted);font-family:'Inter';font-weight:700;font-size:14px;padding:11px;border-radius:9px;cursor:pointer}
.tab.on{background:var(--mango);color:var(--grape)}
.hostq .qtext{font-size:clamp(24px,4.5vw,34px)}
.opt.read{cursor:default}
.opt.read:hover{background:var(--panel2);border-color:var(--line)}
.akrow{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;margin-bottom:9px}
.akrow img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 52px}
.akrow .ak-q{font-size:12px;color:var(--muted);font-weight:600;line-height:1.3}
.akrow .ak-a{font-family:'Fredoka';font-weight:600;font-size:15px;color:var(--mint);margin-top:2px}
.lockcard{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:40px 22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.lockcard .big{font-size:54px;margin-bottom:6px}
.lockcard .rank{font-family:'Fredoka';font-weight:700;font-size:24px}
.lockcard .sub{color:var(--muted);margin-top:8px;font-size:15px}
.qphoto, .qphoto.wide{aspect-ratio:auto;width:100%;height:auto;max-height:64vh;object-fit:contain;background:#160922}
.photobox{aspect-ratio:auto;min-height:150px;max-height:52vh;padding:8px}
.photobox img{width:100%;height:auto;max-height:50vh;object-fit:contain;border-radius:8px}
.olab{flex:0 0 26px;text-align:center;font-family:'Fredoka';font-weight:700;color:var(--muted)}
.votes{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.voteopt{border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--panel2)}
.voteopt.win{border-color:var(--mango);background:rgba(255,178,62,.13)}
.voteopt.empty{opacity:.5}
.vohead{display:flex;align-items:center;gap:10px}
.vohead .lab{flex:0 0 auto}
.votxt{flex:1;font-family:'Fredoka';font-weight:600;font-size:16px;line-height:1.25}
.vcount{font-family:'Fredoka';font-weight:700;font-size:18px;color:var(--mango);white-space:nowrap}
.voteopt .voters{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;padding-left:38px}
.bignum{font-family:'Fredoka';font-weight:700;font-size:72px;line-height:1;color:var(--mango);margin:10px 0 6px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.sw.on{border-color:var(--ink);transform:scale(1.08)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.pcell{position:relative;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);aspect-ratio:3/4}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pcell .pdel{position:absolute;top:6px;right:6px;border:none;background:rgba(0,0,0,.6);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px}
.pcell .pnum{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px}

</style>

<script>
/* =================== GAME CONTENT MODEL =================== */
const RAW = JSON.parse(document.getElementById('gamedata').textContent);
// Migrate old array format -> object model
function asGame(x){
  if(Array.isArray(x)) return { name:"", theme:"mango", tagline:"Roast night 🔥", sub:"", questions:x, roast:[], roastSet:[] };
  return { name:(x.name||'').slice(0,24), theme:x.theme||'mango', tagline:x.tagline||"Roast night 🔥", sub:x.sub||"", questions:x.questions||[], roast:x.roast||[], roastSet:x.roastSet||[] };
}
const DEFAULT_GAME = asGame(RAW);
const LS_KEY='karanpedia_game_v3';
function deep(x){ return JSON.parse(JSON.stringify(x)); }
function loadGame(){
  try{ const s=localStorage.getItem(LS_KEY); if(s){ const g=JSON.parse(s); if(g&&g.questions){ if(g.name===undefined) g.name=''; return asGame(g); } } }catch(e){}
  return deep(DEFAULT_GAME);
}
let GAME = loadGame();
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(GAME)); return true; }catch(e){ return false; } }
/* Product identity + authorship flag (generic landing until the user makes their own) */
const APP_NAME='Partypedia';
function userOwns(){ try{ return localStorage.getItem('kp_own')==='1' || sessionStorage.getItem('kp_demo')==='1'; }catch(e){ return false; } }
function markOwn(){ try{ sessionStorage.removeItem('kp_demo'); localStorage.setItem('kp_own','1'); }catch(e){} }
function markDemo(){ try{ localStorage.removeItem('kp_own'); sessionStorage.setItem('kp_demo','1'); }catch(e){} }
function inDemo(){ try{ return sessionStorage.getItem('kp_demo')==='1' && localStorage.getItem('kp_own')!=='1'; }catch(e){ return false; } }
function exitDemo(){ try{ sessionStorage.removeItem('kp_demo'); }catch(e){} home(); }
function clearOwn(){ try{ localStorage.removeItem('kp_own'); sessionStorage.removeItem('kp_demo'); }catch(e){} }
function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'party'; }

/* =================== THEME + TEMPLATE =================== */
const THEMES={
  mango:{a:'#FFB23E',ad:'#C9791A',b:'#FF4D6D',bd:'#C32C49',label:'Mango'},
  mint:{a:'#39D9A8',ad:'#1E9D77',b:'#34C6E0',bd:'#1f93a8',label:'Mint'},
  coral:{a:'#FF4D6D',ad:'#C32C49',b:'#FFB23E',bd:'#C9791A',label:'Coral'},
  violet:{a:'#B98BFF',ad:'#7d52c9',b:'#FF8AD0',bd:'#c45a9b',label:'Violet'},
  sky:{a:'#34C6E0',ad:'#1f93a8',b:'#FFB23E',bd:'#C9791A',label:'Sky'},
};
function applyTheme(){ const t=THEMES[GAME.theme]||THEMES.mango; const r=document.documentElement.style;
  r.setProperty('--mango',t.a); r.setProperty('--mango-d',t.ad); r.setProperty('--coral',t.b); r.setProperty('--coral-d',t.bd);
  try{ document.title=APP_NAME; }catch(e){} }
function brandName(){ return (GAME.name||'PARTY').toUpperCase(); }
applyTheme();

function newGame(){
  app.innerHTML = topbar()+`
    <section class="ed"><h2>Make it about your friend 🎉</h2>
      <p class="h">Name them and pick a vibe — then add their photos, questions &amp; roasts. The whole game becomes theirs.</p>
      <div class="field"><label>Their name</label>
        <input type="text" id="ng_name" maxlength="20" placeholder="e.g. Sam" value="${esc(GAME.name||'')}"></div>
      <div class="field"><label>Accent colour</label>
        <div class="swatches" id="ng_sw">${Object.keys(THEMES).map(k=>`<button type="button" class="sw${k===(GAME.theme||'mango')?' on':''}" data-t="${k}" title="${THEMES[k].label}" onclick="pickTheme('${k}')" style="background:${THEMES[k].a}"></button>`).join('')}</div></div>
      <div class="btnrow">
        <button class="cta" onclick="createGame()">Create game →</button>
        <button class="cta alt" onclick="home()">Cancel</button>
      </div>
      <div class="edsec"><h3>Or start from the demo</h3>
        <p class="h" style="margin-bottom:10px">Load the built-in demo to see how it fits together, then tweak it.</p>
        <button class="cta alt" onclick="loadDemo()">Load the demo</button></div>
    </section>`;
  window._ngTheme=(GAME.theme||'mango');
  setTimeout(()=>{const e=document.getElementById('ng_name');if(e)e.focus();},50);
}
function pickTheme(k){ window._ngTheme=k; document.querySelectorAll('#ng_sw .sw').forEach(b=>b.classList.toggle('on',b.dataset.t===k)); }
function createGame(){
  const name=(document.getElementById('ng_name').value||'').trim().slice(0,20);
  if(!name){ flash("Add a name first",true); return; }
  GAME={name, theme:(window._ngTheme||'mango'), tagline:`Certified ${name} slander 🔥`, sub:`How well do you really know ${name}?`, questions:[], roast:[], roastSet:[]};
  saveLocal(); markOwn(); applyTheme(); flash("Game created ✓"); editor('quiz');
}
function loadDemo(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} GAME=deep(DEFAULT_GAME); saveLocal(); markDemo(); applyTheme(); flash("Demo loaded — just exploring ✓"); home(); }

const RANKS=[
  {min:1.0,name:"Soulmate Status",sub:"This is genuinely concerning. In a good way."},
  {min:0.8,name:"Certified Day-One",sub:"You know the lore. All of it."},
  {min:0.6,name:"Solid Friend",sub:"You get the vibe, missed a few inside jokes. Respectable."},
  {min:0.4,name:"Plus-One at Best",sub:"You've met a couple of times. It's a start."},
  {min:0.0,name:"Complete Stranger",sub:"Be honest — you just matched on the group trip."},
];
function rankFor(s,t){ const p=t?s/t:0; return RANKS.find(r=>p>=r.min); }

/* =================== STATE / HELPERS =================== */
const app=document.getElementById('app');
const letters=["A","B","C","D","E","F"];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let draft=null, draftIdx=-1, fileTarget=null, edTab='quiz';
function quizPlayable(){ return GAME.questions.filter(q=>q&&q.img&&(q.opts||[]).filter(o=>o&&o.trim()).length>=2); }

/* =================== HOME =================== */
function home(){
  applyTheme();
  const own=userOwns();
  // Real photos only on an actual game (owned/demo); the generic landing stays
  // free of anyone's photos and uses neutral party emoji instead.
  const realFaces=(GAME.questions||[]).filter(q=>q.img).slice(0,5).map(q=>`<img src="${q.img}" alt="">`).join('');
  const emojiFaces=['🥳','😎','🤩','😂','🔥'].map(e=>`<span class="ef">${e}</span>`).join('');
  const hero = own
    ? `<section class="hero">
        <span class="kicker">${esc(GAME.tagline||'Roast night 🔥')}</span>
        <h1 style="font-size:clamp(40px,${brandName().length<=6?'17vw':'12vw'},${brandName().length<=6?'82px':'56px'})"><span class="a">${esc(brandName())}</span><br><span class="b">PEDIA</span></h1>
        ${GAME.sub?`<p>${esc(GAME.sub)}</p>`:''}
        <div class="facepile">${realFaces||emojiFaces}</div>
      </section>`
    : `<section class="hero">
        <span class="kicker">Party games about your friends 🎉</span>
        <h1 style="font-size:clamp(40px,16vw,80px)"><span class="a">PARTY</span><br><span class="b">PEDIA</span></h1>
        <p>Make a photo quiz or a roast battle about anyone in the room — everyone plays on their phone, no app to install.</p>
        <div class="facepile">${emojiFaces}</div>
      </section>`;
  const demoBanner = inDemo()
    ? `<div class="demobar">👀 You're trying the <b>demo game</b> — edit it to make it yours, or <button class="linklike" onclick="exitDemo()">exit to ${esc(APP_NAME)}</button>.</div>`
    : '';
  app.innerHTML = demoBanner + hero + `
    <div class="modes">
      <button class="mode m4" onclick="hostLive()"><span class="ico">📺</span>
        <span><span class="mt">Party Mode</span><span class="ms">Photo quiz · host on the TV · everyone joins by QR</span></span></button>
      <button class="mode m2" onclick="roastLive()"><span class="ico">😈</span>
        <span><span class="mt">Roast Battle</span><span class="ms">Host on TV · everyone writes roasts · vote the best</span></span></button>
    </div>
    ${own
      ? `<button class="editbtn" onclick="editor()">✏️ Edit photos, questions &amp; title</button>
         <button class="editbtn" onclick="newGame()" style="margin-top:8px">✨ Make it about a different friend</button>`
      : `<button class="editbtn" onclick="newGame()">✨ Make your own game</button>
         <button class="editbtn" onclick="editor()" style="margin-top:8px">📥 Bulk-upload photos &amp; add questions</button>
         <button class="editbtn" onclick="loadDemo()" style="margin-top:8px">👀 Try the demo game</button>`}
    <button class="editbtn" onclick="hostLiveP2P()" style="margin-top:8px">🎮 Party Mode — same room, no internet (beta)</button>
    <button class="editbtn" onclick="roastLiveP2P()" style="margin-top:8px">😈 Roast Battle — same room, no internet (beta)</button>
    <div class="home-foot"><button class="linklike" onclick="joinPrompt()">On your phone? Join a live game →</button></div>
    <div class="home-foot"><button class="linklike" onclick="p2pTestHost()" style="opacity:.7">🔌 Test local P2P connection (beta)</button></div>
    <div class="home-foot">${own&&GAME.name?('Made for '+esc(GAME.name)+' • '):APP_NAME+' • '}${new Date().getFullYear()}</div>
    <footer class="credit"><b>Party Mode</b> needs internet for everyone and works best on a TV/laptop the group can see.</footer>`;
}
function topbar(back){
  return `<div class="topbar"><div class="brandmini"><span class="dotk">${esc(APP_NAME[0])}</span>${esc(APP_NAME)}</div>
    <button class="ghostbtn" onclick="${back||'home()'}">↩ ${back?'Back':'Home'}</button></div>`;
}


/* =================== EDITOR =================== */
function editor(tab){
  if(tab) edTab=tab;
  if(edTab!=='roastset') edTab='quiz';
  const isQuiz = edTab==='quiz';
  app.innerHTML = topbar()+`
    <section class="ed">

function fileToDataURL(file,maxDim=1000,q=0.74){
  return new Promise((res,rej)=>{ const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight,m=Math.max(w,h);
      if(m>maxDim){const s=maxDim/m;w=Math.round(w*s);h=Math.round(h*s);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      try{res(c.toDataURL('image/jpeg',q));}catch(e){rej(e);} };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'));}; img.src=url; });
}

/* =================== CSV TEMPLATE (party-mode questions) =================== */
function csvEscape(v){ v=String(v==null?'':v); return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
// Minimal RFC-4180 parser: handles quoted fields, embedded commas/newlines, "" escapes.
function parseCSV(text){
  text=String(text||'').replace(/^﻿/,'');
  const rows=[]; let row=[], field='', i=0, q=false;
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } q=false; i++; continue; } field+=c; i++; continue; }
    if(c==='"'){ q=true; i++; continue; }
    if(c===','){ row.push(field); field=''; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=c; i++;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function downloadQuizCSV(){
  const qs=GAME.questions||[];
  if(!qs.length){ flash('Bulk-upload some photos first',true); return; }
  const maxOpt=Math.min(6,Math.max(4,...qs.map(q=>(q.opts||[]).length)));
  const optCols=letters.slice(0,maxOpt).map(L=>'option_'+L.toLowerCase());
  const header=['photo','question',...optCols];
  const rows=qs.map((q,i)=>{ const key=q.file||('photo-'+(i+1)); const opts=q.opts||[];
    return [key, q.q||'', ...optCols.map((_,j)=>opts[j]||'')]; });
  const csv=[header,...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  downloadText(csv, slug(GAME.name)+'-questions.csv', 'text/csv');
  flash('Template downloaded — fill it in, then upload it back ✓');
}
function uploadQuizCSV(){ fileTarget='csv'; const fi=document.getElementById('filein'); fi.accept='.csv,text/csv'; fi.multiple=false; fi.click(); }
function importQuizCSV(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const rows=parseCSV(r.result);
    if(rows.length<2){ flash('That CSV looks empty',true); return; }
    const head=rows[0].map(h=>String(h).trim().toLowerCase());
    const findCol=(...names)=>{ for(const n of names){ const idx=head.indexOf(n); if(idx>=0) return idx; } return -1; };
    const pi=findCol('photo','image','filename','file','key');
    const qi=findCol('question','q','prompt');
    if(pi<0||qi<0){ flash('CSV needs a "photo" column and a "question" column',true); return; }
    const optIdx=[];
    letters.forEach(Lc=>{ const lc=Lc.toLowerCase(); const idx=findCol('option_'+lc,'option '+lc,'opt_'+lc); if(idx>=0) optIdx.push(idx); });
    if(!optIdx.length){ for(let k=1;k<=6;k++){ const idx=findCol('option_'+k,'option'+k,'opt'+k); if(idx>=0) optIdx.push(idx); } }
    // Map each question by its stored filename (order-independent).
    const byFile={};
    (GAME.questions||[]).forEach((q,i)=>{ const k=(q.file||'').toLowerCase(); if(k && byFile[k]===undefined) byFile[k]=i; });
    const noExt=s=>s.replace(/\.[^.]+$/,'');
    let matched=0, unmatched=0, ready=0; const seen={};
    for(let ri=1; ri<rows.length; ri++){
      const row=rows[ri]; const rawKey=String(row[pi]||'').trim(); if(!rawKey) continue;
      const key=rawKey.toLowerCase(); let qIdx=-1;
      if(byFile[key]!==undefined && !seen[byFile[key]]) qIdx=byFile[key];
      if(qIdx<0){ const ne=noExt(key); for(const [k,idx] of Object.entries(byFile)){ if(!seen[idx]&&noExt(k)===ne){ qIdx=idx; break; } } }
      if(qIdx<0 && /^(photo-?)?\d+$/.test(key)){ const n=parseInt(key.replace(/\D/g,''),10); if(n>=1&&n<=GAME.questions.length && !seen[n-1]) qIdx=n-1; }
      if(qIdx<0){ unmatched++; continue; }
      seen[qIdx]=true;
      const Q=GAME.questions[qIdx];
      Q.q=String(row[qi]||'').trim();
      const opts=optIdx.map(ci=>String(row[ci]||'').trim()).filter(Boolean);
      if(opts.length) Q.opts=opts;
      Q.correct=0; matched++;
      if(Q.q && (Q.opts||[]).filter(o=>o&&o.trim()).length>=2) ready++;
    }
    saveLocal(); if(matched) markOwn(); editor('quiz');
    flash(`Mapped ${matched} row${matched===1?'':'s'}${unmatched?` · ${unmatched} didn't match a photo`:''} · ${ready} ready to play`, matched===0);
  }catch(e){ flash('Could not read that CSV',true); } };
  r.onerror=()=>flash('Could not read that file',true);
  r.readAsText(file);
}

function clearHostSession(){ try{ localStorage.removeItem('kp_host'); }catch(e){} }
/* ---- presence / active players (ghost-proof auto-advance) ---- */
const ACTIVE_MS=14000;
function heartbeat(s){ if(!L||!L.pid||!L.code)return; L._hbAt=Date.now();
  try{ s.from('presence').upsert({room_code:L.code,client_id:clientId(),seen_at:new Date().toISOString()},{onConflict:'room_code,client_id'}).then(()=>{},()=>{}); }catch(e){} }
function activeFilter(arr){ if(!L||!L.activeIds) return arr; const act=arr.filter(p=>p.client_id&&L.activeIds.has(p.client_id)); return act.length?act:arr; }
/* ---- connection resilience ---- */
function subscribeAsPlayer(s){
  try{ if(liveChan&&sb){sb.removeChannel(liveChan);liveChan=null;} }catch(e){}
  liveChan=s.channel('p-'+L.code+'-'+clientId())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'rooms',filter:'code=eq.'+L.code},
      p=>{ if(p.new){ L.room=Object.assign(L.room||{},p.new); onRoomUpdate(); } })
    .subscribe();
  heartbeat(s); startPoll();
}
function startPoll(){ stopPoll(); if(!L)return; L.poll=setInterval(playerResync,3000); }
function stopPoll(){ if(L&&L.poll){ clearInterval(L.poll); L.poll=null; } }
async function playerResync(){
  if(!L||L.role!=='player'||!L.code) return;
  let s; try{ s=await getSB(); }catch(e){ return; }
  if(L.pid && (!L._hbAt || Date.now()-L._hbAt>4500)) heartbeat(s);
  let room,err; try{ ({data:room,error:err}=await s.from('rooms').select('*').eq('code',L.code).maybeSingle()); }catch(e){ return; }
  if(err) return;
  if(!room){ if(L.view!=='gone'){ L.view='gone'; stopPoll(); roomGone(); } return; }
  L.room=room; reconcilePlayer();
}
function startHostPoll(){ if(!L)return; if(L.hostPoll)clearInterval(L.hostPoll); L.hostPoll=setInterval(hostResync,3500); }
async function hostResync(){
  if(!L||L.role!=='host'||!L.code) return;
  let s; try{ s=await getSB(); }catch(e){ return; }
  try{ const {data:ps}=await s.from('players').select('*').eq('room_code',L.code); const map={}; (ps||[]).forEach(p=>map[p.id]=p); L.players=map; }catch(e){}
  try{ const {data:pr}=await s.from('presence').select('client_id,seen_at').eq('room_code',L.code); const cutoff=Date.now()-ACTIVE_MS; const set=new Set(); (pr||[]).forEach(r=>{ if(r.seen_at&&Date.parse(r.seen_at)>cutoff) set.add(r.client_id); }); L.activeIds=set; }catch(e){}
  if(L.mode==='roast'){
    if(L.phase==='writing'||L.phase==='voting'){ try{ await loadRoasts(); }catch(e){} }
    if(L.phase==='voting'){ try{ await loadVotes(); }catch(e){} }
    const ppl=roastPlayers();
    const sig=[L.phase,L.cur,ppl.length,(L.roasts||[]).length,(L.votes||[]).length].join('|');
    if(sig!==L._hsig){ L._hsig=sig; renderRoastHost(); }
    if(L.phase==='writing') maybeAdvanceWriting(); else if(L.phase==='voting') maybeAdvanceVoting();
  } else {
    const ppl=hostPlayers();
    const ans=ppl.filter(p=>(p.last_q|0)>=(L.current_q|0)).length;
    const sig=[L.status,L.current_q,ppl.length,ans].join('|');
    if(sig!==L._hsig){ L._hsig=sig; renderHost(); }
    if(L.status==='playing') maybeAutoAdvance();
  }
}
function liveFocusResync(){ if(!L||!L.code) return;
  if(L.net==='p2p'){ if(L.bye)return; if(L.role==='player' && !(L.dc&&L.dc.readyState==='open')) joinP2P(L.code); return; }
  if(L.role==='player') playerResync(); else if(L.role==='host') hostResync(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) liveFocusResync(); });
addEventListener('online', liveFocusResync);
addEventListener('focus', liveFocusResync);
function roomGone(){ clearSession(); app.innerHTML=topbar()+`<div class="waitcard"><div class="big" style="font-size:44px">🏁</div><div class="rank" style="font-size:22px">Game over</div><div class="sub" style="color:var(--muted);margin:8px 0 18px">The host closed the room. Thanks for playing!</div><button class="cta" onclick="home()">Home</button></div>`; }
function scoreOf(p){ const set=liveSet(); let s=0; const pk=p.picks||[]; for(let i=0;i<set.length;i++) if(pk[i]===set[i].correct) s++; return s; }

/* ---- HOST (TV) ---- */
async function hostLive(){
  if(liveSet().length<1){ flash("Add a photo + options in Edit first",true); editor('quiz'); return; }
  cleanupLive();
  app.innerHTML=topbar()+`<div class="waitcard"><div class="spinner"></div><div class="rank" style="font-size:22px">Starting a room…</div><div class="conn">Connecting to the server</div></div>`;
  let s; try{ s=await getSB(); }catch(e){ return liveError(); }
  const code=roomCode(), total=liveSet().length;
  const {error}=await s.from('rooms').insert({code,status:'lobby',current_q:-1,total_q:total});
  if(error){ return liveError(error.message); }
  history.replaceState(null,'','#host='+code);
  L={role:'host',code,status:'lobby',current_q:-1,players:{}};
  const {data}=await s.from('players').select('*').eq('room_code',code);
  (data||[]).forEach(p=>L.players[p.id]=p);
  subscribeQuizHost(s,code); startHostPoll(); saveHostSession();
  renderHost();
}
function subscribeQuizHost(s,code){
  try{ if(liveChan&&sb){sb.removeChannel(liveChan);liveChan=null;} }catch(e){}
  liveChan=s.channel('room-'+code)
    .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room_code=eq.'+code},
      p=>{ const r=p.new||p.old; if(!r)return; if(p.eventType==='DELETE')delete L.players[r.id]; else { L.players[r.id]=r; if(L.activeIds&&r.client_id)L.activeIds.add(r.client_id); } renderHost(); maybeAutoAdvance(); })
    .subscribe();
}
function hostPlayers(){ if(L&&L.net==='p2p') return Object.values(L.players).filter(p=>p.online!==false); return activeFilter(Object.values(L.players)); }
async function hostStart(){ if(L&&L.net==='p2p') return hostStartP2P(); const s=await getSB(); L.status='playing'; L.current_q=0;
  await s.from('rooms').update({status:'playing',current_q:0}).eq('code',L.code); renderHost(); }
async function hostNext(){ if(L&&L.net==='p2p') return pgHostNext(); if(L&&L.autoTimer){ clearTimeout(L.autoTimer); L.autoTimer=null; } const s=await getSB(); const N=liveSet().length;
  if(L.current_q<N-1){ L.current_q++; await s.from('rooms').update({current_q:L.current_q}).eq('code',L.code); }
  else { L.status='ended'; L.rIdx=0; await s.from('rooms').update({status:'ended'}).eq('code',L.code); }
  renderHost(); }
// Auto-advance: once every joined player has answered the current photo, move the
// TV to the next one after a short beat. Host can still tap Next at any time.
function maybeAutoAdvance(){
  if(!L||L.role!=='host'||L.status!=='playing') return;
  const ppl=hostPlayers(), N=liveSet().length;
  if(ppl.length<1) return;                                 // wait for players
  if(L.current_q>=N-1) return;                             // last photo: host starts the reveal
  if(!ppl.every(p=>(p.last_q|0)>=L.current_q)) return;     // someone is still voting
  if(L.autoTimer) return;                                  // already counting down
  const qAt=L.current_q;
  L.autoTimer=setTimeout(()=>{
    L.autoTimer=null;
    if(!L||L.role!=='host'||L.status!=='playing'||L.current_q!==qAt) return;
    const now=hostPlayers();
    if(now.length>=1 && now.every(p=>(p.last_q|0)>=qAt)) hostNext();
  },1600);
}
function renderHost(){
  if(!L||L.role!=='host') return;
  const ppl=hostPlayers(), set=liveSet(), N=set.length;
  if(L.status==='lobby'){
    app.innerHTML=topbar('leaveHost()')+`
      <div class="lobby">
        <span class="kicker">${esc(GAME.tagline||'Party Mode')}</span>
        <div class="statusline">Open <b style="color:var(--ink)">${esc(location.host+location.pathname)}</b> &amp; tap “Join”, or scan:</div>
        <div class="roomcode">${esc(L.code)}</div>
        <div class="qrbox" id="qr"></div>
        <div class="joinurl">${esc(joinLink(L.code))}</div>
        <div class="statusline">${ppl.length} player${ppl.length===1?'':'s'} joined</div>
        <div class="plist">${ppl.length?ppl.map(p=>`<span class="ptag">${esc(p.name)}</span>`).join(''):'<span class="ptag" style="opacity:.6">waiting for players…</span>'}</div>
        ${L.net==='p2p'?`<button class="cta alt" style="margin-bottom:10px" onclick="pgToggleDisplay()">${L.display==='device'?'📱 Photos on phones':'📺 Photos on this screen (Cast)'} · tap to switch</button>`:''}
        <button class="cta" onclick="hostStart()" ${ppl.length<1?'disabled':''}>${ppl.length<1?'Waiting for players':'Start the game →'}</button>
        <div class="conn">${L.net==='p2p'&&L.display==='device'?'Photos show on each phone — no shared screen needed.':'Players answer on their phones. <b>Keep this on the TV.</b>'}</div>
      </div>`;
    const q=document.getElementById('qr'); if(q) makeQR(joinLink(L.code),q);
    return;
  }
  if(L.status==='playing'){
    const Q=set[L.current_q];
    const answered=ppl.filter(p=>(p.last_q|0)>=L.current_q).length;
    const dots=set.map((_,i)=>`<span class="pd ${i<L.current_q?'done':''} ${i===L.current_q?'cur':''}"></span>`).join('');
    app.innerHTML=topbar('leaveHost()')+`
      <div class="progress">${dots}</div>
      <div class="qcard hostq">
        <img class="qphoto ${Q.wide?'wide':''}" src="${Q.img}" alt=""/>
        <div class="qbody">
          <div class="qnum">Question ${L.current_q+1} of ${N}</div>
          <div class="qtext">${esc(Q.q)}</div>
          <div class="conn" style="margin-top:10px">📱 Everyone: tap your answer on your phone. Options stay off the TV.</div>
        </div>
      </div>
      <div class="statusline" style="text-align:center"><b style="color:var(--mango)">${answered}</b> of ${ppl.length} answered</div>
      ${(ppl.length>0 && answered>=ppl.length && L.current_q<N-1)?'<div class="conn" style="text-align:center;color:var(--mint)">✅ Everyone\'s in — next photo coming up…</div>':''}
      <div class="plist">${ppl.map(p=>`<span class="ptag ${(p.last_q|0)>=L.current_q?'done':''}">${esc(p.name)}${(p.last_q|0)>=L.current_q?' ✓':''}</span>`).join('')}</div>
      <button class="cta" onclick="hostNext()">${L.current_q<N-1?'Next question →':'See what the room thinks 🏁'}</button>
      <div class="conn">Votes stay hidden until everyone's done.</div>`;
    return;
  }
  // ended -> stepped consensus reveal
  return renderReveal();
}
function tallyFor(idx){
  const ppl=hostPlayers(), set=liveSet(), opts=(set[idx].opts||[]).filter(o=>o&&o.trim());
  const voters=opts.map(()=>[]);
  ppl.forEach(p=>{ const pick=(p.picks||[])[idx]; if(typeof pick==='number'&&pick>=0&&pick<opts.length) voters[pick].push(p.name); });
  const counts=voters.map(v=>v.length);
  const top=counts.length?Math.max(0,...counts):0;
  return {opts,voters,counts,top};
}
function renderReveal(){
  const set=liveSet(), N=set.length, idx=L.rIdx||0;
  if(idx>=N) return renderRevealSummary();
  const Q=set[idx], {opts,voters,counts,top}=tallyFor(idx);
  const dots=set.map((_,i)=>`<span class="pd ${i<idx?'done':''} ${i===idx?'cur':''}"></span>`).join('');
  app.innerHTML=topbar('leaveHost()')+`
    <div class="progress">${dots}</div>
    <div class="qcard hostq">
      <img class="qphoto ${Q.wide?'wide':''}" src="${Q.img}" alt=""/>
      <div class="qbody">
        <div class="qnum">Photo ${idx+1} of ${N} · what the room said</div>
        <div class="qtext">${esc(Q.q)}</div>
        ${Q.roast?`<div class="roast" style="margin:4px 0 14px">${esc(Q.roast)}</div>`:''}
        <div class="votes">${opts.map((o,i)=>{
          const isTop=counts[i]===top&&top>0;
          return `<div class="voteopt ${isTop?'win':(counts[i]?'':'empty')}">
            <div class="vohead"><span class="lab">${letters[i]}</span><span class="votxt">${esc(o)}</span>
              <span class="vcount">${isTop?'👑 ':''}${counts[i]}</span></div>
            ${voters[i].length?`<div class="voters">${voters[i].map(n=>`<span class="ptag">${esc(n)}</span>`).join('')}</div>`:''}
          </div>`;}).join('')}</div>
      </div>
    </div>
    <button class="cta" onclick="revealNext()">${idx<N-1?'Next photo →':'See room alignment →'}</button>`;
}
function revealNext(){ L.rIdx=(L.rIdx||0)+1; renderReveal(); }
function renderRevealSummary(){
  const set=liveSet(); let sum=0,cnt=0,unan=0;
  set.forEach((Q,i)=>{ const {counts,top}=tallyFor(i); const tot=counts.reduce((a,b)=>a+b,0); if(tot>0){ sum+=top/tot; cnt++; if(top===tot) unan++; } });
  const align=cnt?Math.round(sum/cnt*100):0;
  burst(true);
  app.innerHTML=topbar('leaveHost()')+`
    <div class="lobby">
      <span class="kicker">Room alignment 🤝</span>
      <div class="bignum">${align}<span style="font-size:.4em">%</span></div>
      <div class="statusline">${align>=80?'This room moves as one. Slightly scary.':align>=55?'Mostly on the same page.':'Wildly divided — this crew contains multitudes.'}</div>
      ${cnt?`<div class="conn">${unan} of ${cnt} photo${cnt===1?'':'s'} were unanimous.</div>`:'<div class="conn">No votes were cast.</div>'}
      <button class="cta" style="margin-top:18px" onclick="leaveHost()">New game 🔁</button>
    </div>`;
}
function leaveHost(){ clearSession(); clearHostSession(); const net=L&&L.net, c=L&&L.code;
  if(net==='p2p'){ try{ pgBroadcast({t:'bye'}); }catch(e){} clearP2PHost(); }
  else if(c){ getSB().then(s=>s.from('rooms').delete().eq('code',c)).catch(()=>{}); }
  cleanupLive(); history.replaceState(null,'',location.pathname); home(); }

async function joinLive(raw){
  const code=(raw||'').trim().toUpperCase();
  if(code.length<4){ flash("Enter the 4-letter code",true); return; }
  cleanupLive();
  app.innerHTML=topbar()+`<div class="waitcard"><div class="spinner"></div><div class="rank" style="font-size:22px">Joining ${esc(code)}…</div></div>`;
  let s; try{ s=await getSB(); }catch(e){ return liveError(); }
  const {data:room}=await s.from('rooms').select('*').eq('code',code).maybeSingle();
  if(!room){ clearSession(); app.innerHTML=topbar()+`<div class="waitcard"><div class="rank" style="font-size:22px">Room ${esc(code)} not found</div><div class="sub" style="color:var(--muted);margin:8px 0 18px">Double-check the code on the TV.</div><button class="cta" onclick="joinPrompt()">Try again</button></div>`; return; }
  L={role:'player',mode:(room.mode||'quiz'),code,room,pid:null,name:null,curQ:-1,picks:[],subs:{},voted:{},ph:null,pcur:-2};
  let existing=null;
  try{ const {data:rows}=await s.from('players').select('*').eq('room_code',code).eq('client_id',clientId()).order('joined_at',{ascending:true}).limit(1); existing=(rows&&rows[0])||null; }catch(e){}
  if(existing){
    L.pid=existing.id; L.name=existing.name; L.picks=existing.picks||[];
    if(L.mode==='roast'){
      try{ const {data:rr}=await s.from('roasts').select('photo_idx').eq('room_code',code).eq('author_id',existing.id); (rr||[]).forEach(r=>{L.subs[r.photo_idx]=true;}); }catch(e){}
      try{ const {data:vv}=await s.from('roast_votes').select('photo_idx').eq('room_code',code).eq('voter_id',existing.id); (vv||[]).forEach(v=>{L.voted[v.photo_idx]=true;}); }catch(e){}
    }
    subscribeAsPlayer(s); saveSession(); onRoomUpdate(true);
  } else {
    renderNameEntry();
  }
}
function renderNameEntry(){
  app.innerHTML=topbar('leavePlayer()')+`
    <section class="setup"><h2>You're in! 🎉</h2>
      <p class="h">Room <b style="color:var(--mango)">${esc(L.code)}</b>. Pick a name everyone will recognise.</p>
      <div class="addrow">
        <input id="myname" placeholder="Your name" maxlength="16" onkeydown="if(event.key==='Enter')submitName()"/>
        <button onclick="submitName()">Join</button>
      </div></section>`;
  setTimeout(()=>{const e=document.getElementById('myname');if(e)e.focus();},50);
}
async function submitName(){
  if(L&&L.net==='p2p') return submitNameP2P();
  const el=document.getElementById('myname'); const name=(el.value||'').trim().slice(0,16);
  if(!name){ flash("Add a name first",true); return; }
  const s=await getSB();
  let pid=null;
  try{ const {data:rows}=await s.from('players').select('id').eq('room_code',L.code).eq('client_id',clientId()).limit(1); if(rows&&rows[0]){ pid=rows[0].id; await s.from('players').update({name}).eq('id',pid); } }catch(e){}
  if(!pid){
    try{ const {data:others}=await s.from('players').select('name,client_id').eq('room_code',L.code);
      const taken=new Set((others||[]).filter(o=>o.client_id!==clientId()).map(o=>(o.name||'').trim().toLowerCase()));
      if(taken.has(name.toLowerCase())){ const base=name.slice(0,13); let n=2; while(n<99&&taken.has((base+' '+n).toLowerCase()))n++; name=base+' '+n; }
    }catch(e){}
    const {data,error}=await s.from('players').insert({room_code:L.code,name,client_id:clientId(),picks:L.picks||[],last_q:-1,score:0}).select().single();
    if(error){
      const {data:rows}=await s.from('players').select('id').eq('room_code',L.code).eq('client_id',clientId()).limit(1);
      if(rows&&rows[0]){ pid=rows[0].id; await s.from('players').update({name}).eq('id',pid); }
      else return liveError(error.message);
    } else pid=data.id;
  }
  L.pid=pid; L.name=name;
  subscribeAsPlayer(s); saveSession(); onRoomUpdate(true);
}
function onRoomUpdate(){ reconcilePlayer(); }
// The phone's screen is a pure function of (room state + what I've locally
// submitted). Recomputed on every realtime event, poll tick, focus and submit,
// so a missed update self-heals within one poll and never clobbers live input.
function reconcilePlayer(){
  if(!L||L.role!=='player'||!L.room) return;
  if(L.mode==='roast') return reconcileRoast();
  return reconcileQuiz();
}
function reconcileQuiz(){
  const st=L.room.status, cq=L.room.current_q|0;
  const key = st==='ended'?'final' : st==='playing'?((L.picks[cq]!=null?'locked-':'q-')+cq) : 'wait';
  if(key===L.view) return; L.view=key;
  if(key==='final'){ playerFinal(); return; }
  if(key==='wait'){ renderPlayerWait(); return; }
  if(key.charAt(0)==='l'){ renderLocked(cq); return; }
  renderPlayerOptions(cq);
}
function renderPlayerWait(){
  app.innerHTML=topbar('leavePlayer()')+`
    <div class="waitcard"><div class="spinner"></div>
      <div class="rank" style="font-size:22px">Get ready, ${esc(L.name)}!</div>
      <div class="sub" style="color:var(--muted);margin-top:8px">Waiting for the host to start. Watch the TV. 📺</div>
      <div class="conn"><b>Connected</b> · room ${esc(L.code)}</div></div>`;
}
function renderPlayerOptions(q){
  const set=liveSet(), Q=set[q]; if(!Q){ renderPlayerWait(); return; }
  if(L.picks[q]!=null){ renderLocked(q); return; }
  const opts=(Q.opts||[]).filter(o=>o&&o.trim());
  app.innerHTML=`
    <div class="turnbanner">📺 <b>${esc(L.name)}</b><span class="pill">${esc(L.code)} · Q ${q+1}/${set.length}</span></div>
    <div class="qcard"><div class="qbody" style="padding-top:20px">
      <div class="qnum">Question ${q+1} of ${set.length} · look at the photo on the TV 📺</div>
      <div class="qtext" style="font-size:19px;color:var(--ink);margin:6px 0 4px">${esc(Q.q)}</div>
      <div class="qsub" style="font-size:14px;color:var(--muted);margin:0 0 14px">Pick your answer 👇</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" onclick="livePick(${q},${i})"><span class="lab">${letters[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    </div></div>
    <footer class="credit">Your pick is hidden until the big reveal on the TV.</footer>`;
  window.scrollTo({top:0});
}
async function livePick(q,i){
  if(L.picks[q]!=null) return;
  L.picks[q]=i;
  const s=await getSB();
  s.from('players').update({picks:L.picks,last_q:q}).eq('id',L.pid).then(()=>{});
  reconcilePlayer();
}
function renderLocked(q){
  const set=liveSet();
  app.innerHTML=topbar('leavePlayer()')+`
    <div class="lockcard"><div class="big">✅</div>
      <div class="rank">Locked in!</div>
      <div class="sub">Answer ${letters[L.picks[q]]} sent. Eyes on the TV — next question is coming.</div>
      <div class="conn" style="margin-top:14px">Q ${q+1} of ${set.length} · room ${esc(L.code)}</div></div>`;
}
function playerFinal(){
  const set=liveSet(); let voted=0; for(let i=0;i<set.length;i++) if(typeof L.picks[i]==='number') voted++;
  burst(true);
  app.innerHTML=topbar('leavePlayer()')+`
    <div class="lockcard"><div class="big">🗳️</div>
      <div class="rank">Votes in!</div>
      <div class="sub">Thanks, ${esc(L.name)} — you voted on ${voted} of ${set.length}. The room's verdict is rolling out on the TV. 📺</div>
      <button class="cta alt" style="margin-top:16px" onclick="leavePlayer()">Done</button></div>`;
}
function leavePlayer(){ clearSession(); clearP2PGuest(); cleanupLive(); history.replaceState(null,'',location.pathname); home(); }
function liveError(msg){
  app.innerHTML=topbar()+`<div class="waitcard">
    <div class="rank" style="font-size:22px">Can't reach the server</div>
    <div class="sub" style="color:var(--muted);margin:10px 0 18px">Party Mode needs internet${msg?': '+esc(msg):''}. Check signal and try again.</div>
    <div class="btnrow"><button class="cta" onclick="home()">Back to home</button></div></div>`;
}

/* =================== ROAST BATTLE (Supabase, host-paced) =================== */
const ROAST_SECONDS=120;
function fmtClock(s){ s=Math.max(0,s|0); const m=Math.floor(s/60), ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
function roastSet(){ return (((L&&L.net==='p2p'&&L.role==='host')?GAME:DEFAULT_GAME).roastSet||[]).filter(p=>p&&p.img); }
function clearTick(){ if(L&&L.tick){ clearInterval(L.tick); L.tick=null; } }
function clearTimers(){ if(!L)return; if(L.advTimer){clearTimeout(L.advTimer);L.advTimer=null;} clearTick(); }
function startTick(){ clearTick(); if(!L)return;
  L.tick=setInterval(()=>{ const el=document.getElementById('rtimer'); if(!el)return;
    const ends=L.role==='host'?(L.phaseEndsAt||0):(L.net==='p2p'?(L.guestEndsAt||0):(L.room&&L.room.phase_ends_at?Date.parse(L.room.phase_ends_at):0));
    el.textContent=fmtClock(Math.ceil((ends-Date.now())/1000)); },250); }

/* ---- HOST (TV) ---- */
async function roastLive(){
  if(roastSet().length<1){ flash("Add roast photos first",true); return; }
  cleanupLive();
  app.innerHTML=topbar()+`<div class="waitcard"><div class="spinner"></div><div class="rank" style="font-size:22px">Starting a roast room…</div><div class="conn">Connecting to the server</div></div>`;
  let s; try{ s=await getSB(); }catch(e){ return liveError(); }
  const code=roomCode(), total=roastSet().length;
  const {error}=await s.from('rooms').insert({code,mode:'roast',status:'lobby',phase:'lobby',current_q:-1,cur_photo:-1,total_q:total});
  if(error){ return liveError(error.message); }
  history.replaceState(null,'','#host='+code);
  L={role:'host',mode:'roast',code,phase:'lobby',cur:-1,players:{},roasts:[],votes:[],phaseEndsAt:0};
  const {data}=await s.from('players').select('*').eq('room_code',code);
  (data||[]).forEach(p=>L.players[p.id]=p);
  subscribeRoastHost(s,code); startHostPoll(); saveHostSession();
  renderRoastHost();
}
function subscribeRoastHost(s,code){
  try{ if(liveChan&&sb){sb.removeChannel(liveChan);liveChan=null;} }catch(e){}
  liveChan=s.channel('roast-'+code)
    .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room_code=eq.'+code},
      p=>{ const r=p.new||p.old; if(!r)return; if(p.eventType==='DELETE')delete L.players[r.id]; else { L.players[r.id]=r; if(L.activeIds&&r.client_id)L.activeIds.add(r.client_id); }
           renderRoastHost(); if(L.phase==='writing')maybeAdvanceWriting(); else if(L.phase==='voting')maybeAdvanceVoting(); })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'roasts',filter:'room_code=eq.'+code},
      p=>{ if(!p.new)return; if(!L.roasts.some(r=>r.id===p.new.id))L.roasts.push(p.new);
           if(L.phase==='writing'){ renderRoastHost(); maybeAdvanceWriting(); } })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'roast_votes',filter:'room_code=eq.'+code},
      p=>{ if(!p.new)return; if(!L.votes.some(v=>v.id===p.new.id))L.votes.push(p.new);
           if(L.phase==='voting'){ renderRoastHost(); maybeAdvanceVoting(); } })
    .subscribe();
}
async function resumeHost(code){
  cleanupLive();
  app.innerHTML=topbar()+`<div class="waitcard"><div class="spinner"></div><div class="rank" style="font-size:22px">Reconnecting room ${esc(code)}…</div><div class="conn">Picking up where you left off</div></div>`;
  let s; try{ s=await getSB(); }catch(e){ return liveError(); }
  const {data:room}=await s.from('rooms').select('*').eq('code',code).maybeSingle();
  if(!room){ clearHostSession(); home(); return; }
  const {data:ps}=await s.from('players').select('*').eq('room_code',code);
  if((room.mode||'quiz')==='roast'){
    L={role:'host',mode:'roast',code,phase:room.phase||'lobby',cur:(room.cur_photo==null?-1:room.cur_photo),players:{},roasts:[],votes:[],phaseEndsAt:0};
    (ps||[]).forEach(p=>L.players[p.id]=p);
    try{ await loadRoasts(); }catch(e){} try{ await loadVotes(); }catch(e){}
    subscribeRoastHost(s,code); startHostPoll(); saveHostSession();
    if(L.phase==='writing'){ const ends=room.phase_ends_at?Date.parse(room.phase_ends_at):Date.now(); L.phaseEndsAt=ends; L.advTimer=setTimeout(()=>advanceWriting(),Math.max(0,ends-Date.now())); }
    history.replaceState(null,'','#host='+code);
    renderRoastHost();
    if(L.phase==='writing') startTick();
  } else {
    L={role:'host',code,status:room.status||'lobby',current_q:(room.current_q==null?-1:room.current_q),players:{}};
    (ps||[]).forEach(p=>L.players[p.id]=p);
    subscribeQuizHost(s,code); startHostPoll(); saveHostSession();
    history.replaceState(null,'','#host='+code);
    renderHost();
  }
}
function roastPlayers(){ if(L&&L.net==='p2p') return Object.values(L.players).filter(p=>p.online!==false); return activeFilter(Object.values(L.players)); }
async function loadRoasts(){ const s=await getSB(); const {data}=await s.from('roasts').select('*').eq('room_code',L.code); L.roasts=data||[]; }
async function loadVotes(){ const s=await getSB(); const {data}=await s.from('roast_votes').select('*').eq('room_code',L.code); L.votes=data||[]; }

function roastStart(){ if(L&&L.net==='p2p') return roastStartP2P(); roastGoto('writing',0); }
async function roastGoto(phase,idx){
  const s=await getSB();
  clearTimers(); L.phase=phase; L.cur=idx;
  const patch={phase,cur_photo:idx};
  if(phase==='writing'){ L.phaseEndsAt=Date.now()+ROAST_SECONDS*1000; patch.phase_ends_at=new Date(L.phaseEndsAt).toISOString();
    L.advTimer=setTimeout(()=>advanceWriting(),ROAST_SECONDS*1000); }
  if(phase==='voting'){ await loadRoasts(); if(L.roasts.filter(r=>r.photo_idx===idx).length===0){ setTimeout(()=>{ if(L&&L.phase==='voting'&&L.cur===idx) advanceVoting(); },2500); } }
  if(phase==='reveal'){ await loadRoasts(); await loadVotes(); }
  await s.from('rooms').update(patch).eq('code',L.code);
  renderRoastHost();
  if(phase==='writing') startTick();
}
function advanceWriting(){ if(L&&L.net==='p2p') return advanceWritingP2P(); if(!L||L.phase!=='writing')return; const key='w'+L.cur; if(L._lastAdv===key)return; L._lastAdv=key;
  const N=roastSet().length; if(L.cur<N-1) roastGoto('writing',L.cur+1); else roastGoto('voting',0); }
function maybeAdvanceWriting(){ if(!L||L.phase!=='writing')return; const ppl=roastPlayers(); if(ppl.length<1)return; const at=L.cur;
  const got=new Set(L.roasts.filter(r=>r.photo_idx===at).map(r=>r.author_id));
  if(ppl.every(p=>got.has(p.id))) setTimeout(()=>{ if(L&&L.phase==='writing'&&L.cur===at) advanceWriting(); },700); }
function advanceVoting(){ if(L&&L.net==='p2p') return advanceVotingP2P(); if(!L||L.phase!=='voting')return; const key='v'+L.cur; if(L._lastAdv===key)return; L._lastAdv=key;
  const N=roastSet().length; if(L.cur<N-1) roastGoto('voting',L.cur+1); else roastGoto('reveal',0); }
function maybeAdvanceVoting(){ if(!L||L.phase!=='voting')return; const ppl=roastPlayers(); if(ppl.length<1)return; const at=L.cur;
  const rs=L.roasts.filter(r=>r.photo_idx===at); const eligible=ppl.filter(p=>rs.some(r=>r.author_id!==p.id));
  const voters=new Set(L.votes.filter(v=>v.photo_idx===at).map(v=>v.voter_id));
  if(eligible.length>0 && eligible.every(p=>voters.has(p.id))) setTimeout(()=>{ if(L&&L.phase==='voting'&&L.cur===at) advanceVoting(); },700); }
function revealNextRoast(){ L.cur=(L.cur||0)+1; renderRoastHost(); }

function renderRoastHost(){
  if(!L||L.role!=='host'||L.mode!=='roast') return;
  const set=roastSet(), N=set.length, ppl=roastPlayers();
  if(L.phase==='lobby'){
    app.innerHTML=topbar('leaveHost()')+`
      <div class="lobby">
        <span class="kicker">Roast Battle 😈</span>
        <div class="statusline">Open <b style="color:var(--ink)">${esc(location.host+location.pathname)}</b> &amp; tap “Join”, or scan:</div>
        <div class="roomcode">${esc(L.code)}</div>
        <div class="qrbox" id="qr"></div>
        <div class="joinurl">${esc(joinLink(L.code))}</div>
        <div class="statusline">${ppl.length} player${ppl.length===1?'':'s'} joined</div>
        <div class="plist">${ppl.length?ppl.map(p=>`<span class="ptag">${esc(p.name)}</span>`).join(''):'<span class="ptag" style="opacity:.6">waiting for players…</span>'}</div>
        ${L.net==='p2p'?`<button class="cta alt" style="margin-bottom:10px" onclick="pgToggleDisplay()">${L.display==='device'?'📱 Photos on phones':'📺 Photos on this screen (Cast)'} · tap to switch</button>`:''}
        <button class="cta" onclick="roastStart()" ${ppl.length<1?'disabled':''}>${ppl.length<1?'Waiting for players':'Start roasting →'}</button>
        <div class="conn">${N} photo${N===1?'':'s'} · ${ROAST_SECONDS%60===0?ROAST_SECONDS/60+' min':ROAST_SECONDS+'s'} each. ${L.net==='p2p'&&L.display==='device'?'Photos show on each phone.':'Everyone roasts on their phone. <b>Keep this on the TV.</b>'}</div>
      </div>`;
    const q=document.getElementById('qr'); if(q) makeQR(joinLink(L.code),q);
    return;
  }
  if(L.phase==='writing'){
    const Q=set[L.cur], subbed=new Set(L.roasts.filter(r=>r.photo_idx===L.cur).map(r=>r.author_id));
    const dots=set.map((_,i)=>`<span class="pd ${i<L.cur?'done':''} ${i===L.cur?'cur':''}"></span>`).join('');
    app.innerHTML=topbar('leaveHost()')+`
      <div class="progress">${dots}</div>
      <div class="qcard hostq">
        <img class="qphoto ${Q.wide?'wide':''}" src="${Q.img}" alt=""/>
        <div class="qbody">
          <div class="qnum">Photo ${L.cur+1} of ${N} · ✍️ write your roast on your phone</div>
          <div class="qtext" style="font-size:44px;color:var(--mango);line-height:1"><span id="rtimer">${fmtClock(ROAST_SECONDS)}</span></div>
          <div class="conn" style="margin-top:6px">Funniest roast wins the vote. No names shown yet.</div>
        </div>
      </div>
      <div class="statusline" style="text-align:center"><b style="color:var(--mango)">${subbed.size}</b> of ${ppl.length} submitted</div>
      <div class="plist">${ppl.map(p=>`<span class="ptag ${subbed.has(p.id)?'done':''}">${esc(p.name)}${subbed.has(p.id)?' ✓':''}</span>`).join('')}</div>
      <button class="cta" onclick="advanceWriting()">${L.cur<N-1?'Skip to next photo →':'Go to voting 🗳️'}</button>`;
    return;
  }
  if(L.phase==='voting'){
    const Q=set[L.cur], rs=L.roasts.filter(r=>r.photo_idx===L.cur);
    const eligible=ppl.filter(p=>rs.some(r=>r.author_id!==p.id));
    const voted=new Set(L.votes.filter(v=>v.photo_idx===L.cur).map(v=>v.voter_id));
    const nVoted=eligible.filter(p=>voted.has(p.id)).length;
    const dots=set.map((_,i)=>`<span class="pd ${i<L.cur?'done':''} ${i===L.cur?'cur':''}"></span>`).join('');
    app.innerHTML=topbar('leaveHost()')+`
      <div class="progress">${dots}</div>
      <div class="qcard hostq">
        <img class="qphoto ${Q.wide?'wide':''}" src="${Q.img}" alt=""/>
        <div class="qbody">
          <div class="qnum">Photo ${L.cur+1} of ${N} · 🗳️ vote for the best roast on your phone</div>
          ${rs.length?`<div class="conn" style="margin-top:6px">${rs.length} roast${rs.length===1?'':'s'} in. You can't vote for your own.</div>`:`<div class="conn" style="margin-top:6px">No roasts for this one — tap next.</div>`}
        </div>
      </div>
      <div class="statusline" style="text-align:center"><b style="color:var(--mango)">${nVoted}</b> of ${eligible.length} voted</div>
      <button class="cta" onclick="advanceVoting()">${L.cur<N-1?'Next photo →':'Reveal the winners 🏆'}</button>`;
    return;
  }
  return renderRoastReveal();
}
function renderRoastReveal(){
  const set=roastSet(), N=set.length, idx=L.cur;
  if(idx>=N) return renderRoastSummary();
  const Q=set[idx];
  const rs=L.roasts.filter(r=>r.photo_idx===idx).map(r=>Object.assign({},r,{n:L.votes.filter(v=>v.roast_id===r.id).length}));
  rs.sort((a,b)=>b.n-a.n);
  const top=rs.length?rs[0].n:0;
  const dots=set.map((_,i)=>`<span class="pd ${i<idx?'done':''} ${i===idx?'cur':''}"></span>`).join('');
  app.innerHTML=topbar('leaveHost()')+`
    <div class="progress">${dots}</div>
    <div class="qcard hostq">
      <img class="qphoto ${Q.wide?'wide':''}" src="${Q.img}" alt=""/>
      <div class="qbody">
        <div class="qnum">Photo ${idx+1} of ${N} · the roasts</div>
        <div class="votes">${rs.length?rs.map(r=>{ const win=r.n===top&&top>0;
          return `<div class="voteopt ${win?'win':(r.n?'':'empty')}">
            <div class="vohead"><span class="votxt">${esc(r.text)}</span><span class="vcount">${win?'👑 ':''}${r.n}</span></div>
            <div class="voters"><span class="ptag">${win?'🏆 ':''}${esc(r.author_name||'anon')}</span></div>
          </div>`;}).join(''):'<div class="conn">Nobody roasted this one 😇</div>'}</div>
      </div>
    </div>
    <button class="cta" onclick="revealNextRoast()">${idx<N-1?'Next photo →':'Crown the best roaster →'}</button>`;
}
function renderRoastSummary(){
  const tally={};
  L.votes.forEach(v=>{ const r=L.roasts.find(x=>x.id===v.roast_id); if(r){ const k=r.author_name||'anon'; tally[k]=(tally[k]||0)+1; } });
  const board=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  burst(true);
  app.innerHTML=topbar('leaveHost()')+`
    <div class="lobby">
      <span class="kicker">Best Roaster 🏆</span>
      ${board.length?`<div class="bignum" style="font-size:34px;margin:10px 0">${esc(board[0][0])}</div>
        <div class="statusline">${board[0][1]} vote${board[0][1]===1?'':'s'} for the funniest roasts of the night.</div>
        <div class="votes" style="margin-top:14px">${board.map(([name,n],i)=>`<div class="voteopt ${i===0?'win':''}">
          <div class="vohead"><span class="votxt">${i===0?'👑 ':(i+1)+'. '}${esc(name)}</span><span class="vcount">${n}</span></div></div>`).join('')}</div>`
        :'<div class="statusline">No votes were cast. Everyone’s a winner? No.</div>'}
      <button class="cta" style="margin-top:18px" onclick="leaveHost()">New game 🔁</button>
    </div>`;
}

/* ---- PLAYER (phone) ---- */
function reconcileRoast(){
  const ph=L.room.phase||'lobby', cur=L.room.cur_photo|0;
  let key;
  if(ph==='reveal'||ph==='done') key='final';
  else if(ph==='writing') key=((L.subs&&L.subs[cur])?'wrote-':'write-')+cur;
  else if(ph==='voting') key=((L.voted&&L.voted[cur])?'voted-':'vote-')+cur;
  else key='wait';
  if(key===L.view) return; L.view=key;
  if(key==='final'){ clearTick(); roastPlayerFinal(); return; }
  if(key==='wait'){ clearTick(); roastPlayerWait(); return; }
  if(ph==='writing'){
    if(L.subs&&L.subs[cur]){ clearTick(); roastWaitMsg('Roast locked in 🔥','Watch the TV — next photo soon.',cur); }
    else { roastRenderWrite(cur); startTick(); }
    return;
  }
  clearTick();
  if(L.voted&&L.voted[cur]){ roastWaitMsg('Vote locked 🗳️','Watch the TV for the results.',cur); }
  else { roastRenderVote(cur); }
}
function roastPlayerWait(){
  app.innerHTML=topbar('leavePlayer()')+`
    <div class="waitcard"><div class="spinner"></div>
      <div class="rank" style="font-size:22px">Get ready, ${esc(L.name)}!</div>
      <div class="sub" style="color:var(--muted);margin-top:8px">Roast Battle starts when the host hits go. Watch the TV. 📺</div>
      <div class="conn"><b>Connected</b> · room ${esc(L.code)}</div></div>`;
}
function roastRenderWrite(cur){
  const set=roastSet();
  if(L.subs&&L.subs[cur]){ return roastWaitMsg('Roast locked in 🔥','Watch the TV — next photo soon.',cur); }
  app.innerHTML=`
    <div class="turnbanner">✍️ <b>${esc(L.name)}</b><span class="pill">${esc(L.code)} · ⏱ <span id="rtimer">${fmtClock(ROAST_SECONDS)}</span></span></div>
    <div class="qcard"><div class="qbody" style="padding-top:20px">
      <div class="qnum">Photo ${cur+1} of ${set.length} — look at the TV 📺</div>
      <div class="qtext" style="font-size:18px;margin:6px 0 10px">Roast this photo 🔥</div>
      <textarea id="rtext" maxlength="140" rows="3" placeholder="Type your funniest roast…" style="width:100%;box-sizing:border-box;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font-family:'Inter';font-size:16px;padding:12px;resize:none"></textarea>
      <button class="cta" style="margin-top:12px" onclick="submitRoast(${cur})">Send roast →</button>
      <div class="conn" style="margin-top:8px">Keep it short &amp; savage. Auto-locks when time runs out.</div>
    </div></div>`;
  setTimeout(()=>{const e=document.getElementById('rtext');if(e)e.focus();},50);
}
async function submitRoast(cur){
  const el=document.getElementById('rtext'); const text=(el?el.value:'').trim().slice(0,140);
  if(!text){ flash("Type a roast first",true); return; }
  if(!L.subs)L.subs={};
  if(L.subs[cur]) return;
  L.subs[cur]=true;
  const s=await getSB();
  const {error}=await s.from('roasts').insert({room_code:L.code,photo_idx:cur,author_id:L.pid,author_name:L.name,text});
  if(error && !/duplicate/i.test(error.message||'')){ L.subs[cur]=false; flash("Couldn't send, try again",true); return; }
  reconcilePlayer();
}
async function roastRenderVote(cur){
  const set=roastSet();
  if(L.voted&&L.voted[cur]){ return roastWaitMsg('Vote locked 🗳️','Watch the TV for the results.',cur); }
  app.innerHTML=topbar('leavePlayer()')+`<div class="waitcard"><div class="spinner"></div><div class="rank" style="font-size:20px">Loading roasts…</div></div>`;
  const s=await getSB();
  const {data}=await s.from('roasts').select('id,text,author_id').eq('room_code',L.code).eq('photo_idx',cur);
  let rs=(data||[]).filter(r=>r.author_id!==L.pid);
  for(let i=rs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=rs[i]; rs[i]=rs[j]; rs[j]=t; }
  if(!L.room||L.room.phase!=='voting'||L.room.cur_photo!==cur) return;
  if(!rs.length){ return roastWaitMsg('Nothing to vote here','Your roast is in. Watch the TV. 📺',cur); }
  app.innerHTML=`
    <div class="turnbanner">🗳️ <b>${esc(L.name)}</b><span class="pill">${esc(L.code)} · ${cur+1}/${set.length}</span></div>
    <div class="qcard"><div class="qbody" style="padding-top:20px">
      <div class="qnum">Photo ${cur+1} — vote the funniest 🔥</div>
      <div class="opts">${rs.map(r=>`<button class="opt" style="text-align:left" onclick="voteRoast(${cur},'${r.id}')"><span>${esc(r.text)}</span></button>`).join('')}</div>
    </div></div>
    <footer class="credit">You can't vote for your own roast.</footer>`;
  window.scrollTo({top:0});
}
async function voteRoast(cur,roastId){
  if(!L.voted)L.voted={};
  if(L.voted[cur]) return;
  L.voted[cur]=true;
  const s=await getSB();
  const {error}=await s.from('roast_votes').insert({room_code:L.code,photo_idx:cur,roast_id:roastId,voter_id:L.pid});
  if(error && !/duplicate/i.test(error.message||'')){ L.voted[cur]=false; flash("Couldn't vote, try again",true); return; }
  reconcilePlayer();
}
function roastWaitMsg(title,sub,cur){
  const set=roastSet();
  app.innerHTML=topbar('leavePlayer()')+`
    <div class="lockcard"><div class="big">✅</div>
      <div class="rank">${esc(title)}</div>
      <div class="sub">${esc(sub)}</div>
      <div class="conn" style="margin-top:14px">Photo ${(cur|0)+1} of ${set.length} · room ${esc(L.code)}</div></div>`;
}
function roastPlayerFinal(){
  burst(true);
  app.innerHTML=topbar('leavePlayer()')+`
    <div class="lockcard"><div class="big">🏆</div>
      <div class="rank">Roasts are in!</div>
      <div class="sub">Thanks, ${esc(L.name)} — the winners are rolling out on the TV. 📺</div>
      <button class="cta alt" style="margin-top:16px" onclick="leavePlayer()">Done</button></div>`;
}

/* =================== P2P TRANSPORT TEST (WebRTC, Supabase broadcast = signaling only) =================== */
/* Same-wifi parties connect directly (host candidates / STUN). The TURN relays
   below are a best-effort fallback ONLY for networks that block direct P2P.
   These are free public relays — they can be rate-limited or go down. For a
   guaranteed relay, replace TURN_SERVERS with your own free Metered/Twilio key. */
const TURN_SERVERS=[
  {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}
];
const ICE_CONF={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},...TURN_SERVERS]};
let P=null;
function p2pLog(m){ if(!P)return; P.log=P.log||[]; P.log.unshift('['+new Date().toLocaleTimeString()+'] '+m); if(P.log.length>50)P.log.pop(); p2pTestRender(); }
function cleanupP2P(){ if(!P)return;
  try{ if(P.helloTimer)clearInterval(P.helloTimer); }catch(e){}
  try{ Object.values(P.peers||{}).forEach(pr=>{ try{pr.dc&&pr.dc.close();}catch(e){} try{pr.pc&&pr.pc.close();}catch(e){} }); }catch(e){}

    else if(m.t==='pong'){ p2pLog('📩 pong from '+who.slice(0,4)+' — round-trip OK ✓'); }

async function pgHostSignal(m){

    pc.onconnectionstatechange=()=>{ const st=pc.connectionState; if(st==='failed'||st==='closed') pgDrop(gid); };

  } else if(m.type==='answer'){

    for(const c of peer.pending){ try{await peer.pc.addIceCandidate(c);}catch(e){} } peer.pending=[];

function pgDrop(gid){ if(!L||L.role!=='host')return; const p=L.peers&&L.peers[gid]; if(p){ try{p.dc&&p.dc.close();}catch(e){} try{p.pc&&p.pc.close();}catch(e){} delete L.peers[gid]; }
  if(L.players&&L.players[gid]) L.players[gid].online=false;
  if(L.mode==='roast'){ renderRoastHost(); if(L.phase==='writing')maybeAdvanceWritingP2P(); else if(L.phase==='voting')maybeAdvanceVotingP2P(); }

function pgHostMsg(gid,o){

  }
}
