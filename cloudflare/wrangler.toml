name = "partypedia-signaling"
main = "worker.js"
compatibility_date = "2025-01-01"

# One Durable Object class = one signaling relay per room code.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Free-tier Durable Objects require the SQLite-backed storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
